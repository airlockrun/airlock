# Security boundary: third-party packages are not allowed to run
# postinstall / build scripts. esbuild's binary ships via the
# @esbuild/{platform}-{arch} sibling packages (optionalDependencies)
# rather than the main package's postinstall, so blocking it here
# doesn't break Vite at build time.
ignoredBuiltDependencies:
  - esbuild

overrides:
  esbuild: 0.28.1
  postcss: 8.5.23
  'nanoid@>=3.0.0 <3.3.18': 3.3.18
  'undici@>=7.0.0 <7.29.0': 7.29.0
